services:
  facelessforge-mongo:
    image: mongo:7
    container_name: facelessforge-mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - facelessforge_mongo_data:/data/db
    networks:
      - facelessforge_net

  facelessforge-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: facelessforge-app
    restart: unless-stopped
    ports:
      - "7001:8080"
    env_file:
      - /opt/facelessforge/deploy/.env.facelessforge
    depends_on:
      - facelessforge-mongo
    networks:
      - facelessforge_net
    volumes:
      - facelessforge_renders:/app/backend/static/renders
      - facelessforge_audio:/app/backend/static/audio
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  facelessforge_mongo_data:
  facelessforge_renders:
  facelessforge_audio:

networks:
  facelessforge_net:
    driver: bridge
